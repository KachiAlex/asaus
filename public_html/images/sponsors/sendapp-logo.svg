    <circle cx="0" cy="14" r="8" fill="#8e44ad"/>
    <circle cx="-13" cy="7" r="8" fill="#9b59b6"/>
    <circle cx="-13" cy="-7" r="8" fill="#8e44ad"/>
    <circle cx="0" cy="0" r="9" fill="#7d3c98"/>
  </g>
  <!-- by Flutterwave -->
