    <path d="M0,-22 L5,-8 L18,-14 L10,-3 L22,2 L9,4 L13,18 L3,9 L0,22 L-3,9 L-13,18 L-9,4 L-22,2 L-10,-3 L-18,-14 L-5,-8 Z" fill="url(#greenGrad)"/>
    <defs>
